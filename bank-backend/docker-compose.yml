version: '3.8'

services:
  # --- 服務 1: MySQL 資料庫 ---
  mysqldb:
    image: mysql:8.0
    container_name: banking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banking_app
    ports:
      - "3307:3306" # 將容器的 3306 對應到本機的 3307 (避免與你本機安裝的 MySQL 衝突)
    volumes:
      - mysql_data:/var/lib/mysql # 資料持久化，重啟後資料還在
    networks:
      - banking-net

  # --- 服務 2: Spring Boot 應用程式 ---
  app:
    container_name: banking-app
    build: . # 使用當前目錄下的 Dockerfile 建置
    ports:
      - "8080:8080" # 開放 API 端口
    environment:
      # 這裡的變數會直接注入到你的 application.properties
      - MYSQLHOST=mysqldb      # 關鍵！這裡填寫資料庫的 Service Name
      - MYSQLPORT=3306         # 容器內部的 Port
      - MYSQLDATABASE=banking_app
      - MYSQLUSER=root
      - MYSQLPASSWORD=root
      - SPRING_PROFILES_ACTIVE=prod # 可選，若無特定 profile 可省略
    depends_on:
      - mysqldb # 確保 DB 先啟動
    restart: on-failure # 如果連線 DB 失敗會自動重試
    networks:
      - banking-net

# 定義網路
networks:
  banking-net:
    driver: bridge

# 定義 Volume (儲存資料庫資料)
volumes:
  mysql_data: