# ==========================================

# Application

# ==========================================

spring.application.name=banking-app
spring.main.banner-mode=off

# Behind reverse proxy / load balancer

# ? Spring Boot ???? X-Forwarded-* headers??? HTTPS?Host?Port

server.forward-headers-strategy=framework

# JSON ????

spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================

# Database Configuration

# ==========================================

# ?????

# host: localhost

# port: 3306

# database: banking_app

# username: root

# password: root

#

# Docker / VPS / Railway ??????????

# MYSQLHOST

# MYSQLPORT

# MYSQLDATABASE

# MYSQLUSER

# MYSQLPASSWORD

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:banking_app}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================

# HikariCP Connection Pool

# ==========================================

# Spring Boot ???? HikariCP?

# ?????? Micrometer ??????

# hikaricp_connections_active

# hikaricp_connections_idle

# hikaricp_connections_pending

spring.datasource.hikari.pool-name=BankingHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================

# JPA / Hibernate Configuration

# ==========================================

# ddl-auto ???

# update   : ???????Hibernate ????? Entity ?????

# validate : production ???? Flyway / Liquibase???? schema

# none     : ???? Hibernate ?? schema

spring.jpa.hibernate.ddl-auto=update

# production ????? show-sql??? log ?????

# ????? SQL?????? true?

spring.jpa.show-sql=false

# ??? Hibernate SQL?

# show-sql=false ?????????????????????

spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ???? Hibernate SQL????????????

# logging.level.org.hibernate.SQL=DEBUG

# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================

# JWT Configuration

# ==========================================

# production ????????? JWT_SECRET ???????????

spring.app.jwtSecret=${JWT_SECRET:ThisIsADefaultSecretForLocalDevelopmentOnlyPleaseDoNotUseInProd}

# JWT Token expiration

# 172800000 ms = 48 hours

spring.app.jwtExpirationMs=172800000

# Structured Logging

# ==========================================

# Spring Boot 3.5 ?? structured logging?

# logstash ????? JSON log???? MDC ?? requestId / method / path / status ????

logging.level.root=INFO
logging.level.net.javaguides.banking=INFO
logging.structured.format.console=logstash
logging.structured.json.add.application=banking-app

spring.jpa.open-in-view=false


# ==========================================
# Actuator Health Check
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true